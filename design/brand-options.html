<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Options</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#F2F4F6; --line:#E5E8EB; --sub:#8B95A1; --text:#191F28; --card:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Pretendard, -apple-system, sans-serif; background:#E9ECEF; color:var(--text); padding:32px 16px; }
  h1 { font-size:22px; text-align:center; margin-bottom:6px; }
  .lead { text-align:center; color:var(--sub); font-size:14px; margin-bottom:28px; }
  .options { display:flex; flex-wrap:wrap; gap:36px; justify-content:center; }
  .opt { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .opt-head { text-align:center; }
  .opt-head b { font-size:18px; }
  .opt-head p { font-size:13px; color:var(--sub); margin-top:2px; }
  .swatches { display:flex; gap:6px; justify-content:center; margin-top:6px; }
  .swatches i { width:20px; height:20px; border-radius:6px; display:block; border:1px solid rgba(0,0,0,.06); }
  .phones { display:flex; gap:14px; }
  .phone { width:280px; height:540px; background:var(--card); border-radius:34px; overflow:hidden; position:relative;
           box-shadow:0 10px 30px rgba(0,0,0,.10); border:8px solid #111; display:flex; flex-direction:column; }
  .status { height:22px; font-size:11px; font-weight:600; display:flex; justify-content:space-between; padding:4px 18px 0; }
  .top { padding:10px 20px 0; font-size:13px; color:var(--sub); display:flex; align-items:center; gap:6px; }
  .title { padding:14px 20px 0; font-size:22px; font-weight:700; line-height:1.35; letter-spacing:-.3px; }
  .amount { padding:22px 20px 0; font-size:32px; font-weight:700; letter-spacing:-.5px; }
  .amount small { font-size:14px; color:var(--sub); font-weight:500; display:block; margin-top:6px; letter-spacing:0; }
  .quick { display:flex; gap:6px; padding:16px 20px 0; }
  .quick span { font-size:12px; padding:7px 10px; border-radius:10px; background:var(--bg); color:#4E5968; font-weight:600; }
  .keypad { margin-top:auto; display:grid; grid-template-columns:repeat(3,1fr); padding:0 12px; }
  .keypad div { text-align:center; padding:9px 0; font-size:19px; font-weight:600; }
  .cta { margin:10px 14px 16px; height:50px; border-radius:14px; color:#fff; font-weight:700; font-size:16px;
         display:flex; align-items:center; justify-content:center; }
  /* receipt screen */
  .r-bg { background:var(--bg); flex:1; display:flex; flex-direction:column; }
  .hero { margin:12px 14px 0; border-radius:20px; padding:18px; color:#fff; }
  .hero .k { font-size:12px; opacity:.85; }
  .hero .v { font-size:26px; font-weight:700; margin-top:4px; letter-spacing:-.4px; }
  .hero .bars { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .bar { font-size:11px; }
  .bar .row { display:flex; justify-content:space-between; opacity:.95; }
  .bar .track { height:6px; border-radius:6px; background:rgba(255,255,255,.28); margin-top:4px; overflow:hidden; }
  .bar .fill { height:100%; background:#fff; border-radius:6px; }
  .list { margin:12px 14px; background:#fff; border-radius:20px; padding:6px 0; }
  .li { display:flex; align-items:center; gap:10px; padding:11px 14px; }
  .ic { width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .li .t { flex:1; min-width:0; }
  .li .t b { font-size:13px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li .t span { font-size:11px; color:var(--sub); white-space:nowrap; }
  .li .m { font-size:13px; font-weight:700; text-align:right; white-space:nowrap; }
  .li .m span { display:block; font-size:10px; font-weight:600; margin-top:2px; }
  .sec { font-size:12px; color:var(--sub); padding:14px 20px 0; font-weight:600; }
  .note { max-width:900px; margin:36px auto 0; background:#fff; border-radius:16px; padding:18px 20px; font-size:14px; line-height:1.6; color:#333D4B; }
</style>
</head>
<body>
<h1>브랜드 방향 시안 — 같은 UX 뼈대, 다른 정체성</h1>
<p class="lead">왼쪽 폰: "얼마를 보낼까요?" (보내는 사람) · 오른쪽 폰: 실시간 영수증 (보내는 사람) · 글꼴 Pretendard</p>

<div class="options" id="options"></div>

<div class="note">
  <b>공통(토스 원칙):</b> 화면당 질문 하나 · 큰 질문형 제목 · 큰 금액 + 키패드 · 하단 버튼 하나 · 회색 배경 위 흰 카드 · 크립토 단어 숨김 · "들어왔어요 · 0.8초"처럼 결과와 시간을 보여줌.<br>
  <b>달라지는 것:</b> 포인트 색, 카드 톤, 카테고리 아이콘 배경. 아이콘·일러스트는 선택 후 Codex로 제작 (지금은 이모지 자리표시).
</div>

<script>
const brands = [
  { key:"A", name:"A · 새싹 초록", mood:"성장·안심·'잘 쓰이고 있어요'", main:"#12A56B", deep:"#0B7A4F", tint:"#E6F6EE",
    sw:["#12A56B","#0B7A4F","#E6F6EE","#191F28"] },
  { key:"B", name:"B · 노을 코랄", mood:"따뜻함·가족·고향 저녁", main:"#F2613F", deep:"#C9431F", tint:"#FDECE6",
    sw:["#F2613F","#C9431F","#FDECE6","#191F28"] },
  { key:"C", name:"C · 밤하늘 인디고", mood:"신뢰·기술·또렷함 (민트 포인트)", main:"#4B5BF0", deep:"#2F3BC0", tint:"#ECEEFE",
    sw:["#4B5BF0","#2F3BC0","#19C2A0","#191F28"] },
];
const el = document.getElementById("options");
for (const b of brands) {
  el.insertAdjacentHTML("beforeend", `
  <div class="opt">
    <div class="opt-head"><b>${b.name}</b><p>${b.mood}</p>
      <div class="swatches">${b.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</div></div>
    <div class="phones">
      <div class="phone">
        <div class="status"><span>9:41</span><span>●●●</span></div>
        <div class="top">← <span>엄마 · 호찌민</span></div>
        <div class="title">얼마를 보낼까요?</div>
        <div class="amount">300,000원<small>엄마는 <b style="color:${b.main}">₫5,520,000</b> 받아요</small><small style="margin-top:2px">수수료 0원 · 1초 안에 도착</small></div>
        <div class="quick"><span>+1만</span><span>+5만</span><span>+10만</span><span>전액</span></div>
        <div class="keypad">${["1","2","3","4","5","6","7","8","9","00","0","←"].map(k=>`<div>${k}</div>`).join("")}</div>
        <div class="cta" style="background:${b.main}">다음</div>
      </div>
      <div class="phone">
        <div class="status"><span>9:41</span><span>●●●</span></div>
        <div class="r-bg">
          <div class="hero" style="background:linear-gradient(135deg, ${b.main}, ${b.deep})">
            <div class="k">이번 달 엄마에게 보낸 돈</div>
            <div class="v">₫5,520,000</div>
            <div class="bars">
              ${[["식료품",62],["학비",100],["병원",15]].map(([n,p])=>`
              <div class="bar"><div class="row"><span>${n}</span><span>${p}% 썼어요</span></div>
              <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`).join("")}
            </div>
          </div>
          <div class="sec">방금</div>
          <div class="list">
            ${[["🛒","Bách Hóa Xanh","식료품 · 0.8초 정산","₫350,000"],
               ["📚","Anh Ngữ Việt Mỹ","학비 · 0.7초 정산","₫2,000,000"],
               ["💊","Pharmacity","병원 · 0.9초 정산","₫180,000"]].map(([i,t,s,m])=>`
            <div class="li"><div class="ic" style="background:${b.tint}">${i}</div>
              <div class="t"><b>${t}</b><span>${s}</span></div>
              <div class="m">${m}<span style="color:${b.main}">영수증</span></div></div>`).join("")}
          </div>
        </div>
      </div>
    </div>
  </div>`);
}
</script>
</body>
</html>
